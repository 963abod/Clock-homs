<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ساعة حمص القديمة | ذاكرة مدينة</title>
<meta name="description" content="ساعة حمص القديمة - ذاكرة مدينة ودقات لا تشبه أي زمن">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<style>
/* ─── Variables ─────────────────────────────────────────── */
:root {
  --bg-primary:   #0a0a0a;
  --bg-secondary: #111;
  --bg-tertiary:  #1a1a1a;
  --accent:       #c9a96e;
  --accent-light: #e0c99a;
  --text-primary: #f5f0e8;
  --text-secondary:#9a9185;
  --text-muted:   #5c554d;
  --divider:      rgba(201,169,110,0.15);
}

/* ─── Reset ─────────────────────────────────────────────── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  font-family:'Cairo','Tajawal',sans-serif;
  background:var(--bg-primary);
  color:var(--text-primary);
  overflow-x:hidden;
  line-height:1.8;
}

/* ─── Reduced Motion ────────────────────────────────────── */
@media (prefers-reduced-motion:reduce) {
  *, *::before, *::after {
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}

/* ─── Scrollbar ──────────────────────────────────────────── */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:var(--bg-primary); }
::-webkit-scrollbar-thumb { background:var(--accent); border-radius:3px; }

/* ─── Accessibility: Focus Styles ───────────────────────── */
a:focus-visible,
button:focus-visible {
  outline:2px solid var(--accent);
  outline-offset:4px;
  border-radius:2px;
}

/* ─── Screen-Reader Only ────────────────────────────────── */
.sr-only {
  position:absolute;
  width:1px; height:1px;
  padding:0; margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}

/* ─── Scroll Progress Bar ───────────────────────────────── */
.scroll-progress {
  position:fixed;
  top:0; left:0;
  width:0%;
  height:2px;
  background:linear-gradient(to left, var(--accent-light), var(--accent));
  z-index:10001;
  pointer-events:none;
  transition:width .1s linear;
}

/* ─── Nav ───────────────────────────────────────────────── */
.nav {
  position:fixed;
  top:0; left:0; right:0;
  z-index:1000;
  padding:1.5rem 3rem;
  display:flex;
  justify-content:space-between;
  align-items:center;
  transition:all .6s cubic-bezier(.16,1,.3,1);
  opacity:0;
  transform:translateY(-20px);
}
.nav.visible {
  opacity:1;
  transform:translateY(0);
  background:rgba(10,10,10,.85);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--divider);
}

.nav-logo {
  font-family:'Tajawal',sans-serif;
  font-weight:900;
  font-size:1.2rem;
  color:var(--accent);
  letter-spacing:2px;
}

/* Hamburger button — hidden on desktop */
.nav-toggle {
  display:none;
  flex-direction:column;
  gap:5px;
  cursor:pointer;
  padding:5px;
  background:none;
  border:none;
  z-index:1001;
}
.nav-toggle span {
  display:block;
  width:24px;
  height:2px;
  background:var(--accent);
  border-radius:2px;
  transition:transform .3s ease, opacity .3s ease;
}
.nav-toggle.active span:nth-child(1) { transform:rotate(45deg) translate(5px,5px); }
.nav-toggle.active span:nth-child(2) { opacity:0; }
.nav-toggle.active span:nth-child(3) { transform:rotate(-45deg) translate(5px,-5px); }

/* Mobile overlay backdrop */
.nav-overlay {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:999;
  opacity:0;
  pointer-events:none;
  transition:opacity .3s;
}
.nav-overlay.active { opacity:1; pointer-events:all; }

.nav-links {
  display:flex;
  gap:2.5rem;
  list-style:none;
}
.nav-links a {
  color:var(--text-secondary);
  text-decoration:none;
  font-size:.85rem;
  font-weight:500;
  letter-spacing:1px;
  transition:color .3s;
  position:relative;
}
.nav-links a::after {
  content:'';
  position:absolute;
  bottom:-4px; right:0;
  width:0; height:1px;
  background:var(--accent);
  transition:width .3s;
}
.nav-links a:hover,
.nav-links a.active { color:var(--accent); }
.nav-links a:hover::after,
.nav-links a.active::after { width:100%; }

/* ─── Back to Top Button ────────────────────────────────── */
.back-to-top {
  position:fixed;
  bottom:2rem; left:2rem;
  width:44px; height:44px;
  background:var(--accent);
  color:var(--bg-primary);
  border:none;
  border-radius:50%;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.2rem;
  z-index:998;
  opacity:0;
  transform:translateY(20px);
  transition:opacity .3s, transform .3s, background .3s;
  pointer-events:none;
}
.back-to-top.visible { opacity:1; transform:translateY(0); pointer-events:all; }
.back-to-top:hover   { background:var(--accent-light); }

/* ─── Hero ──────────────────────────────────────────────── */
.hero {
  position:relative;
  width:100%; height:100vh; height:100dvh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}
.hero-bg {
  position:absolute;
  inset:0; z-index:1;
  background:var(--bg-tertiary); /* fallback if image missing */
}
.hero-bg img {
  width:100%; height:100%;
  object-fit:cover;
  transform:scale(1.2);
  filter:brightness(.4) contrast(1.1);
}
.hero-overlay {
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,
    rgba(10,10,10,.3) 0%,
    rgba(10,10,10,.1) 40%,
    rgba(10,10,10,.6) 70%,
    var(--bg-primary)  100%
  );
  z-index:2;
}
.hero-content {
  position:relative;
  z-index:3;
  text-align:center;
  padding:2rem;
  max-width:900px;
}
.hero-eyebrow {
  font-size:.8rem;
  letter-spacing:6px;
  color:var(--accent);
  margin-bottom:1.5rem;
  opacity:0;
  transform:translateY(30px);
}
.hero-title {
  font-family:'Tajawal',sans-serif;
  font-weight:900;
  font-size:clamp(2.5rem,8vw,5.5rem);
  line-height:1.1;
  margin-bottom:1.5rem;
  opacity:0;
  transform:translateY(40px);
  text-shadow:0 4px 30px rgba(0,0,0,.5);
}
.hero-title .line { display:block; overflow:hidden; }
.hero-subtitle {
  font-size:clamp(1rem,2.5vw,1.4rem);
  color:var(--text-secondary);
  font-weight:300;
  letter-spacing:2px;
  opacity:0;
  transform:translateY(30px);
}
.hero-scroll-indicator {
  position:absolute;
  bottom:2.5rem;
  left:50%; transform:translateX(-50%);
  z-index:3;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:.5rem;
  opacity:0;
}
.hero-scroll-indicator span { font-size:.7rem; letter-spacing:3px; color:var(--text-muted); }
.hero-scroll-line {
  width:1px; height:50px;
  background:linear-gradient(to bottom,var(--accent),transparent);
  animation:scrollPulse 2s ease-in-out infinite;
}
@keyframes scrollPulse {
  0%,100% { opacity:.3; transform:scaleY(.5); }
  50%      { opacity:1;  transform:scaleY(1); }
}

/* ─── Sections ──────────────────────────────────────────── */
.section { position:relative; padding:8rem 2rem; overflow:hidden; }
.section-inner { max-width:1200px; margin:0 auto; position:relative; z-index:2; }

/* ─── Cinematic Image ───────────────────────────────────── */
.cinematic-image {
  position:relative;
  width:100%; height:70vh; min-height:400px;
  overflow:hidden;
  margin:4rem 0;
  border-radius:4px;
  background:var(--bg-tertiary); /* fallback */
}
.cinematic-image img {
  width:100%; height:100%;
  object-fit:cover;
  transform:scale(1.15);
}
.cinematic-image::after {
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(to top,var(--bg-primary) 0%,transparent 40%);
  pointer-events:none;
}

/* ─── Timeline ──────────────────────────────────────────── */
.timeline { position:relative; padding:4rem 0; }
.timeline-line {
  position:absolute;
  right:50%; top:0; bottom:0;
  width:1px;
  background:linear-gradient(to bottom,transparent,var(--accent),transparent);
  transform:translateX(50%);
  opacity:.3;
}
.timeline-item {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4rem;
  align-items:center;
  margin-bottom:8rem;
  position:relative;
}
.timeline-item:last-child { margin-bottom:0; }

/* FIX: even-item layout flip (direction:ltr on grid, rtl on children) */
.timeline-item:nth-child(even)            { direction:ltr; }
.timeline-item:nth-child(even) > *        { direction:rtl; }

.timeline-content { opacity:0; transform:translateY(50px); }

.timeline-year {
  font-family:'Tajawal',sans-serif;
  font-weight:900;
  font-size:clamp(3rem,8vw,6rem);
  color:var(--accent);
  opacity:.15;
  line-height:1;
  margin-bottom:1rem;
  display:block;
}
.timeline-title {
  font-size:clamp(1.3rem,3vw,2rem);
  font-weight:700;
  margin-bottom:1rem;
  color:var(--text-primary);
}
.timeline-desc { color:var(--text-secondary); font-size:1rem; line-height:2; }

.timeline-image {
  position:relative;
  overflow:hidden;
  border-radius:4px;
  opacity:0;
  transform:scale(.9);
  background:var(--bg-tertiary); /* fallback */
  min-height:200px;              /* keep space if image missing */
}
.timeline-image img {
  width:100%; height:auto;
  display:block;
  filter:grayscale(30%);
  transition:filter .6s;
}
.timeline-image:hover img { filter:grayscale(0); }
.timeline-image::before {
  content:'';
  position:absolute;
  inset:0;
  border:1px solid var(--divider);
  border-radius:4px;
  z-index:2;
  pointer-events:none;
}

/* ─── Quote ─────────────────────────────────────────────── */
.quote-section {
  padding:10rem 2rem;
  text-align:center;
  position:relative;
}
.quote-section::before {
  content:'"';
  font-family:'Tajawal',sans-serif;
  font-size:15rem;
  color:var(--accent);
  opacity:.05;
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  line-height:1;
  pointer-events:none;
}
.quote-text {
  font-size:clamp(1.2rem,3vw,2rem);
  font-weight:300;
  color:var(--text-primary);
  max-width:800px;
  margin:0 auto;
  line-height:2;
  opacity:0;
  transform:translateY(40px);
  font-style:normal; /* reset blockquote default */
}
.quote-accent { color:var(--accent); font-weight:600; }

/* ─── Comparison ────────────────────────────────────────── */
.comparison {
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:6rem 2rem;
  position:relative;
}
.comparison-title {
  text-align:center;
  margin-bottom:4rem;
  opacity:0;
  transform:translateY(30px);
}
.comparison-title h2 {
  font-family:'Tajawal',sans-serif;
  font-weight:900;
  font-size:clamp(2rem,5vw,3.5rem);
  margin-bottom:1rem;
}
.comparison-title p { color:var(--text-secondary); font-size:1rem; }

.comparison-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0;
  max-width:1400px;
  margin:0 auto;
  width:100%;
  position:relative;
}
.comparison-divider {
  position:absolute;
  top:0; bottom:0;
  left:50%;
  width:1px;
  background:linear-gradient(to bottom,transparent,var(--accent),transparent);
  transform:translateX(-50%);
  z-index:10;
}
.comparison-side { padding:3rem; position:relative; overflow:hidden; }
.comparison-side-left  { opacity:0; transform:translateX(-60px); }
.comparison-side-right { opacity:0; transform:translateX(60px);  }

.comparison-label {
  font-family:'Tajawal',sans-serif;
  font-weight:900;
  font-size:1.5rem;
  color:var(--accent);
  margin-bottom:1.5rem;
  letter-spacing:2px;
}
.comparison-image {
  width:100%;
  height:400px;
  overflow:hidden;
  border-radius:4px;
  margin-bottom:1.5rem;
  position:relative;
  background:var(--bg-tertiary); /* fallback */
}
.comparison-image img {
  width:100%; height:100%;
  object-fit:cover;
  transition:transform .8s cubic-bezier(.16,1,.3,1);
}
.comparison-image:hover img { transform:scale(1.05); }
.comparison-desc { color:var(--text-secondary); font-size:.95rem; line-height:1.9; }
.comparison-year {
  display:inline-block;
  background:var(--accent);
  color:var(--bg-primary);
  padding:.3rem 1rem;
  border-radius:2px;
  font-weight:700;
  font-size:.85rem;
  margin-bottom:1rem;
}

/* ─── Final Section ─────────────────────────────────────── */
.final {
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:6rem 2rem;
  position:relative;
  overflow:hidden;
}
.final-bg {
  position:absolute;
  inset:0; z-index:1;
  background:var(--bg-tertiary);
}
.final-bg img {
  width:100%; height:100%;
  object-fit:cover;
  filter:brightness(.25) saturate(.8);
  transform:scale(1.1);
}
.final-overlay {
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,
    var(--bg-primary) 0%,
    rgba(10,10,10,.7) 50%,
    var(--bg-primary)  100%
  );
  z-index:2;
}
.final-content { position:relative; z-index:3; max-width:800px; }
.final-sequence { margin-bottom:3rem; }
.final-clock-name {
  font-family:'Tajawal',sans-serif;
  font-weight:900;
  font-size:clamp(2rem,6vw,4rem);
  margin-bottom:.5rem;
  opacity:0;
  transform:translateY(30px);
}
.final-clock-name.old { color:var(--accent); }
.final-clock-name.new { color:var(--text-primary); }
.final-transition { font-size:1.5rem; color:var(--text-muted); margin:2rem 0; opacity:0; }
.final-text {
  font-size:clamp(1.2rem,3vw,1.8rem);
  font-weight:300;
  color:var(--text-secondary);
  line-height:2;
  opacity:0;
  transform:translateY(30px);
}
.final-text strong { color:var(--accent); font-weight:600; }

/* ─── Footer ─────────────────────────────────────────────── */
.footer {
  padding:3rem 2rem;
  text-align:center;
  border-top:1px solid var(--divider);
  background:var(--bg-secondary);
}
.footer-credit { font-size:.85rem; color:var(--text-muted); letter-spacing:1px; }
.footer-credit a {
  color:var(--accent);
  text-decoration:none;
  font-weight:600;
  transition:color .3s;
  position:relative;
}
.footer-credit a::after {
  content:'';
  position:absolute;
  bottom:-2px; right:0;
  width:100%; height:1px;
  background:var(--accent);
  transform:scaleX(0);
  transform-origin:left;
  transition:transform .3s;
}
.footer-credit a:hover::after { transform:scaleX(1); transform-origin:right; }
.footer-credit a:hover { color:var(--accent-light); }

/* ─── Grain Overlay ─────────────────────────────────────── */
.grain {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  pointer-events:none;
  z-index:9999;
  opacity:.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
}

/* ─── Loading Screen ────────────────────────────────────── */
.loading {
  position:fixed;
  inset:0;
  background:var(--bg-primary);
  z-index:10000;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:1rem;
  transition:opacity .8s, visibility .8s;
}
.loading.hidden { opacity:0; visibility:hidden; pointer-events:none; }
.loading-text {
  font-family:'Tajawal',sans-serif;
  font-weight:900;
  font-size:1.5rem;
  color:var(--accent);
  letter-spacing:4px;
}
.loading-bar {
  width:120px; height:1px;
  background:var(--bg-tertiary);
  position:relative;
  overflow:hidden;
}
.loading-bar::after {
  content:'';
  position:absolute;
  top:0; right:0;
  height:100%; width:40%;
  background:var(--accent);
  animation:loadingSlide 1.5s ease-in-out infinite;
}
@keyframes loadingSlide {
  0%   { transform:translateX(200%); }
  100% { transform:translateX(-300%); }
}

/* ─── Mobile Responsive ─────────────────────────────────── */
@media (max-width:768px) {
  .nav { padding:1rem 1.5rem; }

  /* Show hamburger button */
  .nav-toggle { display:flex; }

  /* Show overlay container on mobile */
  .nav-overlay { display:block; }

  /* Slide-in nav panel from left (RTL: button is on the left) */
  .nav-links {
    display:flex;
    position:fixed;
    top:0;
    left:-100%;         /* slides in from left side */
    right:auto;
    width:80%;
    max-width:300px;
    height:100vh;
    background:rgba(10,10,10,.98);
    backdrop-filter:blur(20px);
    border-right:1px solid var(--divider);
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:2rem;
    z-index:1000;
    padding:2rem;
    transition:left .4s cubic-bezier(.16,1,.3,1);
  }
  .nav-links.active { left:0; }
  .nav-links a { font-size:1.2rem; letter-spacing:2px; }

  .section        { padding:4rem 1.5rem; }
  .quote-section  { padding:6rem 1.5rem; }
  .cinematic-image{ height:50vh; }

  /* Stack timeline vertically */
  .timeline-item {
    grid-template-columns:1fr;
    gap:2rem;
    margin-bottom:4rem;
  }
  /* Reset even-item flip — not needed in single column */
  .timeline-item:nth-child(even)     { direction:rtl; }
  .timeline-item:nth-child(even) > * { direction:rtl; }
  .timeline-line { display:none; }

  /* Stack comparison vertically */
  .comparison-grid      { grid-template-columns:1fr; }
  .comparison-divider   { display:none; }
  .comparison-side      { padding:1.5rem; }

  .back-to-top { bottom:1.5rem; left:1.5rem; }
}
</style>
</head>
<body>

<!-- ════════════════════════════════════════════════════════
     LOADING SCREEN
     ═══════════════════════════════════════════════════════ -->
<div class="loading" id="loading" role="status" aria-label="جاري تحميل الصفحة">
  <div class="loading-text">حمص</div>
  <div class="loading-bar"></div>
</div>

<!-- Grain texture overlay -->
<div class="grain" aria-hidden="true"></div>

<!-- Scroll progress bar -->
<div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

<!-- Mobile nav backdrop -->
<div class="nav-overlay" id="navOverlay" aria-hidden="true"></div>

<!-- Back to top -->
<button class="back-to-top" id="backToTop" aria-label="العودة إلى أعلى الصفحة">↑</button>


<!-- ════════════════════════════════════════════════════════
     NAVIGATION
     ═══════════════════════════════════════════════════════ -->
<nav class="nav" id="nav" role="navigation" aria-label="التنقل الرئيسي">
  <div class="nav-logo">ساعة حمص</div>

  <!-- FIX: Added hamburger button (was missing — nav links hidden on mobile with no alternative) -->
  <button
    class="nav-toggle"
    id="navToggle"
    aria-label="فتح القائمة"
    aria-expanded="false"
    aria-controls="navLinks"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <ul class="nav-links" id="navLinks" role="list">
    <li><a href="#hero">الرئيسية</a></li>
    <li><a href="#story">القصة</a></li>
    <li><a href="#comparison">ساعتان</a></li>
    <li><a href="#final">الختام</a></li>
  </ul>
</nav>


<!-- ════════════════════════════════════════════════════════
     HERO
     ═══════════════════════════════════════════════════════ -->
<section class="hero" id="hero" aria-label="ساعة حمص القديمة">
  <div class="hero-bg">
    <!-- aria-hidden: decorative, described by the h1 below -->
    <img
      src="old-clock-1.jpg"
      alt=""
      id="hero-img"
      aria-hidden="true"
    >
  </div>
  <div class="hero-overlay" aria-hidden="true"></div>

  <div class="hero-content">
    <div class="hero-eyebrow">ذاكرة مدينة</div>
